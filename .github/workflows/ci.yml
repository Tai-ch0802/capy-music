name: ci
on:
  push:
    branches: [main]
  pull_request:
# 最小權限:CI 只需要讀 repo。沒寫 permissions 時 GITHUB_TOKEN 權限取決於 repo 設定,
# 明寫 contents: read,PR 裡被改壞的步驟也拿不到寫入權。
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false # 兩個平台獨立回報,單邊紅燈不取消另一邊
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # action 一律釘 commit SHA(tag 可被移動,參考 2025-03 tj-actions 事件);
      # 版本註解留在行尾,Dependabot 升版時會一起改寫。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 後續步驟不需要 git 憑證,不留在 .git/config
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - run: bash -n scripts/p0/*.sh
        shell: bash
      - name: 決策 9:-ldflags 注入的內建 Google client 要真的到得了程式(debug google-client 只印 ID)
        run: test "$(go run -ldflags '-X github.com/Tai-ch0802/capy-music/internal/auth.BuiltinGoogleClientID=ci-test' ./cmd/capy debug google-client)" = ci-test
        shell: bash
  release-dry-run:
    # 每個 PR 都把 .goreleaser.yaml 整套跑一遍(四個目標交叉編譯、壓縮檔命名、checksums、注入),
    # 不必等到推 tag 才發現 release 壞掉;--snapshot 不建 Release、不上傳。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # --snapshot 不發布任何東西,這裡保留快取加速 PR;真正發版的 release.yml 已關快取
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GOOGLE_CLIENT_ID: ci-test
          GOOGLE_CLIENT_SECRET: ci-test
      - name: 產物齊全、檔名照契約、注入到位
        run: |
          ls -l dist/
          ls dist/capy_*_darwin_amd64.tar.gz dist/capy_*_darwin_arm64.tar.gz dist/capy_*_windows_amd64.zip dist/capy_*_windows_arm64.zip dist/checksums.txt
          tar tzf dist/capy_*_darwin_arm64.tar.gz | grep -qx LICENSE # 壓縮檔要附授權(GoReleaser 預設抓 LICENSE*,檔名改了會靜靜掉出去)
          bin=$(find dist -type f -name capy -path '*darwin_arm64*')
          test -n "$bin"
          "$bin" --version
          test "$("$bin" --version)" != "capy version dev" # cli.version 的 -X 路徑錯了,capy update 的自檢會拒絕每一個真 release
          test "$("$bin" debug google-client)" = ci-test
          test "$("$bin" debug google-client --secret-state)" = set # BuiltinGoogleClientSecret 的 -X 路徑錯了,release.yml 只檢查 env var 擋不到;這裡不印 secret
