<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>capy</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-connected="true">
<!-- 使用者看得到的字都由 js/i18n.js 的 applyStatic() 依 data-i18n* 填上(決策 50):這裡的元素先是空的。 -->
<nav class="rail" data-i18n-aria-label="webui.rail.label">
  <div class="rail__brand">capy<span>.</span></div>
  <a class="rail__item is-active" href="#/move" data-page="move"><span class="rail__glyph" aria-hidden="true">⇄</span><span data-i18n="webui.rail.move"></span><span class="rail__key">1</span></a>
  <a class="rail__item" href="#/playlists" data-page="playlists"><span class="rail__glyph" aria-hidden="true">♫</span><span data-i18n="webui.rail.playlists"></span><span class="rail__key">2</span></a>
  <a class="rail__item" href="#/sync" data-page="sync"><span class="rail__glyph" aria-hidden="true">↻</span><span data-i18n="webui.rail.sync"></span><span class="rail__key">3</span></a>
  <a class="rail__item" href="#/search" data-page="search"><span class="rail__glyph" aria-hidden="true">⚲</span><span data-i18n="webui.rail.search"></span><span class="rail__key">4</span></a>
  <a class="rail__item" href="#/wiki" data-page="wiki"><span class="rail__glyph" aria-hidden="true">✎</span><span data-i18n="webui.rail.wiki"></span><span class="rail__key">5</span></a>
  <a class="rail__item" href="#/account" data-page="account"><span class="rail__glyph" aria-hidden="true">☺</span><span data-i18n="webui.rail.account"></span><span class="rail__key">6</span></a>
  <details class="rail__more" id="rail-more">
    <summary data-i18n="webui.rail.more"></summary>
    <a class="rail__item" href="#/console" data-page="console"><span class="rail__glyph" aria-hidden="true">›</span><span data-i18n="webui.rail.console"></span><span class="rail__key">7</span></a>
    <a class="rail__item" href="#/isrc" data-page="isrc"><span class="rail__glyph" aria-hidden="true">#</span><span data-i18n="webui.rail.isrc"></span><span class="rail__key">8</span></a>
    <a class="rail__item" href="#/doctor" data-page="doctor"><span class="rail__glyph" aria-hidden="true">✓</span><span data-i18n="webui.rail.doctor"></span><span class="rail__key">9</span></a>
  </details>
  <div class="rail__meta"><span id="version">—</span> · <span data-i18n="webui.rail.default_provider"></span> <span id="default-provider">—</span></div>
  <select class="in rail__lang" id="lang" data-run data-i18n-aria-label="webui.lang.label"></select>
</nav>
<main class="main" id="main">
  <section class="page" id="page-move"></section>
  <section class="page" id="page-console" hidden>
    <section class="console" id="console" role="region" data-i18n-aria-label="webui.rail.console"></section>
  </section>
  <section class="page" id="page-search" hidden></section>
  <section class="page" id="page-playlists" hidden></section>
  <section class="page" id="page-sync" hidden></section>
  <section class="page" id="page-wiki" hidden></section>
  <section class="page" id="page-account" hidden></section>
  <section class="page" id="page-doctor" hidden></section>
  <section class="page" id="page-isrc" hidden>
    <div class="page__head">
      <h2 class="page__title" data-i18n="webui.isrc.title"></h2>
      <p class="page__lead" data-i18n="webui.isrc.lead"></p>
    </div>
    <div class="isrc__bar">
      <label class="isrc__label" for="isrc-input">ISRC</label>
      <input id="isrc-input" class="in in--mono" spellcheck="false" autocomplete="off" placeholder="TWK231680790">
      <button type="button" class="btn btn--primary" id="isrc-go" data-i18n="webui.isrc.go"></button>
    </div>
    <p class="isrc__status" id="isrc-status" role="status"></p>
    <div id="isrc-out"></div>
  </section>
</main>
<footer class="dock">
  <div class="dock__now" id="now" data-playing="false">
    <span class="sr-only dock__now-line" id="now-line" data-i18n="webui.player.loading"></span>
    <div class="dock__now-left">
      <button type="button" class="dock__art-btn" id="now-art-btn" data-i18n-aria-label="webui.player.open_theater" data-i18n-title="webui.player.open_theater">
        <img class="dock__art" id="now-art" alt="" hidden>
        <span class="dock__art-fallback" id="now-art-fallback" aria-hidden="true"></span>
      </button>
      <div class="dock__meta">
        <div class="dock__title-row">
          <span class="dock__prov" id="now-prov" hidden></span>
          <span class="dock__title" id="now-title" data-i18n="webui.player.loading"></span>
        </div>
        <div class="dock__sub" id="now-sub"></div>
      </div>
      <button type="button" class="btn btn--ghost btn--icon dock__collect" id="now-collect" hidden data-i18n-aria-label="webui.player.collect">+</button>
    </div>
    <div class="dock__now-mid">
      <div class="dock__ctl">
        <button type="button" class="btn btn--ghost btn--icon dock__ctl-btn" id="now-shuffle" data-act="shuffle" data-i18n-aria-label="webui.player.shuffle">🔀</button>
        <button type="button" class="btn btn--ghost btn--icon dock__ctl-btn" data-act="prev" data-i18n-aria-label="webui.player.prev">⏮</button>
        <button type="button" class="btn dock__ctl-btn dock__ctl-btn--main" id="now-toggle" data-act="toggle" data-i18n-aria-label="webui.player.play">▶</button>
        <button type="button" class="btn btn--ghost btn--icon dock__ctl-btn" data-act="next" data-i18n-aria-label="webui.player.next">⏭</button>
        <button type="button" class="btn btn--ghost btn--icon dock__ctl-btn" id="now-repeat" data-act="repeat" data-i18n-aria-label="webui.player.repeat">🔁</button>
      </div>
      <div class="dock__seek">
        <span class="dock__time num" id="now-pos">0:00</span>
        <input type="range" class="dock__range" id="now-seek" min="0" max="0" value="0" step="1000" disabled data-i18n-aria-label="webui.player.seek">
        <span class="dock__time num" id="now-dur">0:00</span>
      </div>
    </div>
    <div class="dock__now-right">
      <div class="dock__vol" id="now-vol-wrap">
        <button type="button" class="btn btn--ghost btn--icon dock__ctl-btn" id="now-mute" data-act="mute" data-i18n-aria-label="webui.player.mute">🔊</button>
        <input type="range" class="dock__range dock__range--vol" id="now-vol" min="0" max="100" value="0" disabled data-i18n-aria-label="webui.player.volume">
      </div>
      <div class="dock__pop-wrap" id="now-dev-wrap">
        <button type="button" class="btn btn--ghost dock__chip-btn" id="now-dev-btn" aria-expanded="false" data-i18n-aria-label="webui.player.devices">
          <span aria-hidden="true">🔈</span><span class="dock__chip-text" id="now-dev-label"></span>
        </button>
        <div class="dock__pop" id="now-dev-pop" hidden></div>
      </div>
      <div class="dock__pop-wrap" id="now-timer-wrap">
        <button type="button" class="btn btn--ghost dock__chip-btn" id="now-timer-btn" aria-expanded="false" data-i18n-aria-label="webui.timer.button">
          <span aria-hidden="true">♨</span><span class="dock__chip-text" id="now-timer-label" data-i18n="webui.timer.short"></span>
        </button>
        <div class="dock__pop" id="now-timer-pop" hidden></div>
      </div>
    </div>
  </div>
  <div class="dock__busy" id="busy" hidden>
    <span class="dock__busy-dot" aria-hidden="true">●</span>
    <a class="dock__busy-cmd" id="busy-cmd" href="#/console"></a>
    <span class="dock__busy-act" id="busy-act"></span>
    <progress class="bar dock__busy-bar" id="busy-progress" max="1" value="0" hidden data-i18n-aria-label="webui.console.progress"></progress>
    <span class="dock__busy-time" id="busy-time" aria-hidden="true">running 00:00</span>
    <button type="button" class="btn btn--danger" id="cancel" data-i18n="webui.console.stop"></button>
  </div>
  <span class="sr-only" id="busy-sr" role="status"></span>
  <div class="dock__notice" id="notice" role="status" hidden></div>
  <div class="dock__cmd" id="cmdline" role="group" data-i18n-aria-label="webui.shell.cmdline">
    <label class="dock__prompt" for="cmd">capy</label>
    <input id="cmd" name="cmd" class="dock__input" list="commands" autocomplete="off" spellcheck="false" data-i18n-placeholder="webui.shell.cmd_placeholder">
    <datalist id="commands"></datalist>
    <button type="button" class="btn btn--primary" id="run" data-run data-i18n="webui.shell.run"></button>
  </div>
</footer>
<dialog id="collect" class="collect-dlg"></dialog>
<dialog id="theater" class="theater"></dialog>
<dialog id="keys" class="keys">
  <h2 class="keys__title" data-i18n="webui.keys.title"></h2>
  <dl class="keys__list">
    <dt>space</dt><dd data-i18n="webui.keys.space"></dd>
    <dt>n p</dt><dd data-i18n="webui.keys.next_prev"></dd>
    <dt>← →</dt><dd data-i18n="webui.keys.seek"></dd>
    <dt>+ -</dt><dd data-i18n="webui.keys.volume"></dd>
    <dt>m</dt><dd data-i18n="webui.keys.mute"></dd>
    <dt>s</dt><dd data-i18n="webui.keys.search"></dd>
    <dt>a</dt><dd data-i18n="webui.keys.collect"></dd>
    <dt>z</dt><dd data-i18n="webui.keys.theater"></dd>
    <dt>1 – 9</dt><dd data-i18n="webui.keys.pages"></dd>
    <dt>/</dt><dd data-i18n="webui.keys.slash"></dd>
    <dt>Ctrl-C</dt><dd data-i18n="webui.keys.ctrl_c"></dd>
    <dt>r</dt><dd data-i18n="webui.keys.reconnect"></dd>
    <dt>?</dt><dd data-i18n="webui.keys.help"></dd>
    <dt>Esc</dt><dd data-i18n="webui.keys.esc"></dd>
  </dl>
  <p class="keys__note" data-i18n="webui.keys.note"></p>
  <form method="dialog"><button class="btn btn--ghost" data-i18n="webui.keys.close"></button></form>
</dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
