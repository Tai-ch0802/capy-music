<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>capy</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-connected="true">
<nav class="rail" aria-label="頁面">
  <div class="rail__brand">capy<span class="rail__cursor" aria-hidden="true">_</span></div>
  <a class="rail__item is-active" href="#/console" data-page="console">主控台<span class="rail__key">1</span></a>
  <a class="rail__item" href="#/search" data-page="search">搜尋<span class="rail__key">2</span></a>
  <a class="rail__item" href="#/playlists" data-page="playlists">播放清單<span class="rail__key">3</span></a>
  <a class="rail__item" href="#/sync" data-page="sync">同步<span class="rail__key">4</span></a>
  <a class="rail__item" href="#/isrc" data-page="isrc">ISRC<span class="rail__key">5</span></a>
  <a class="rail__item" href="#/account" data-page="account">帳號<span class="rail__key">6</span></a>
  <a class="rail__item" href="#/doctor" data-page="doctor">診斷<span class="rail__key">7</span></a>
  <div class="rail__meta"><span id="version">—</span> · <span id="default-provider">—</span></div>
</nav>
<main class="main" id="main">
  <section class="page" id="page-console">
    <section class="console" id="console" role="region" aria-label="主控台"></section>
  </section>
  <section class="page" id="page-search" hidden></section>
  <section class="page" id="page-playlists" hidden></section>
  <section class="page" id="page-sync" hidden></section>
  <section class="page" id="page-account" hidden></section>
  <section class="page" id="page-doctor" hidden></section>
  <section class="page" id="page-isrc" hidden>
    <h2 class="page__title">ISRC 查詢</h2>
    <div class="isrc__bar">
      <label class="isrc__label" for="isrc-input">ISRC</label>
      <input id="isrc-input" class="dock__input" spellcheck="false" autocomplete="off" placeholder="TWK231680790">
      <button type="button" class="btn btn--primary" id="isrc-go">查詢</button>
    </div>
    <p class="isrc__status" id="isrc-status" role="status"></p>
    <div id="isrc-out"></div>
  </section>
</main>
<footer class="dock">
  <div class="dock__now" id="now" data-playing="false">
    <span class="dock__now-line" id="now-line">讀取播放狀態…</span>
    <span class="dock__now-ctl">
      <button type="button" class="btn btn--ghost" data-cmd="play" data-run aria-label="播放">▶</button>
      <button type="button" class="btn btn--ghost" data-cmd="pause" data-run aria-label="暫停">⏸</button>
      <button type="button" class="btn btn--ghost" data-cmd="prev" data-run aria-label="上一首">⏮</button>
      <button type="button" class="btn btn--ghost" data-cmd="next" data-run aria-label="下一首">⏭</button>
    </span>
  </div>
  <div class="dock__busy" id="busy" hidden>
    <span class="dock__busy-dot" aria-hidden="true">●</span>
    <a class="dock__busy-cmd" id="busy-cmd" href="#/console" title="到主控台看完整輸出"></a>
    <span class="dock__busy-act" id="busy-act"></span>
    <span class="dock__busy-time" id="busy-time" aria-hidden="true">running 00:00</span>
    <button type="button" class="btn btn--danger" id="cancel">中止</button>
  </div>
  <span class="sr-only" id="busy-sr" role="status"></span>
  <div class="dock__notice" id="notice" hidden></div>
  <div class="dock__cmd" id="cmdline" role="group" aria-label="命令列">
    <label class="dock__prompt" for="cmd">capy</label>
    <input id="cmd" name="cmd" class="dock__input" list="commands" autocomplete="off" spellcheck="false" placeholder="pl show 通勤 · search 五月天 · auth status">
    <datalist id="commands"></datalist>
    <button type="button" class="btn btn--primary" id="run" data-run>執行</button>
  </div>
</footer>
<dialog id="keys" class="keys">
  <h2 class="keys__title">鍵位</h2>
  <dl class="keys__list">
    <dt>space</dt><dd>播放與暫停</dd>
    <dt>n p</dt><dd>下一首、上一首</dd>
    <dt>← →</dt><dd>前後各十秒</dd>
    <dt>+ -</dt><dd>音量升降五格</dd>
    <dt>1 – 7</dt><dd>跳到左邊第 n 頁</dd>
    <dt>/</dt><dd>跳到命令列</dd>
    <dt>Ctrl-C</dt><dd>命令列有焦點、沒選取文字時:中止執行中的命令(同 dock 的「中止」)</dd>
    <dt>r</dt><dd>讀不到播放狀態而停擺後,重新連上</dd>
    <dt>?</dt><dd>開這張表</dd>
    <dt>Esc</dt><dd>回到指令模式(離開輸入框)</dd>
  </dl>
  <p class="keys__note">任何輸入框有焦點時,單鍵快捷鍵全部失效。</p>
  <form method="dialog"><button class="btn btn--ghost">關閉</button></form>
</dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
